# IntelItalia — despliegue completo.
#   cp .env.example .env   (y completar las claves)
#   docker compose up -d --build
#
# Solo `web` publica un puerto. MongoDB y Redis quedan en la red interna de Docker,
# con autenticación y sin puertos expuestos (ver docs/ARQUITECTURA.md, sección 2).
# Para desarrollo local ver docker-compose.dev.yml.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USUARIO_ROOT:?Falta MONGO_USUARIO_ROOT en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_CLAVE_ROOT:?Falta MONGO_CLAVE_ROOT en .env}
      MONGO_INITDB_DATABASE: intelitalia
      # Usuario con permisos solo sobre la base intelitalia; es el que usa la API.
      MONGO_USUARIO_APP: ${MONGO_USUARIO_APP:?Falta MONGO_USUARIO_APP en .env}
      MONGO_CLAVE_APP: ${MONGO_CLAVE_APP:?Falta MONGO_CLAVE_APP en .env}
    volumes:
      - datos-mongo:/data/db
      - ./docker/mongo/crear-usuario-app.js:/docker-entrypoint-initdb.d/crear-usuario-app.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_CLAVE:?Falta REDIS_CLAVE en .env}', '--appendonly', 'yes']
    environment:
      REDISCLI_AUTH: ${REDIS_CLAVE}
    volumes:
      - datos-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUERTO: 3000
      MONGO_URI: mongodb://${MONGO_USUARIO_APP}:${MONGO_CLAVE_APP}@mongo:27017/intelitalia
      REDIS_URL: redis://:${REDIS_CLAVE}@redis:6379
      ORIGEN_FRONTEND: ${ORIGEN_FRONTEND:-http://localhost:8080}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${PUERTO_WEB:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  datos-mongo:
  datos-redis:
